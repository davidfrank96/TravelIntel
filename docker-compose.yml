services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  briefing_api:
    build: .
    restart: unless-stopped
    command: python -m briefing.run_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_BACKEND: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      BRIEFING_CACHE_DAYS: ${BRIEFING_CACHE_DAYS:-7}
      BRIEFING_API_HOST: 0.0.0.0
      BRIEFING_API_PORT: 8000

  scraper:
    build: .
    restart: unless-stopped
    profiles: ["legacy"]
    command: python main.py --schedule 6 --health-port 8081
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_BACKEND: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      USE_PLAYWRIGHT: ${USE_PLAYWRIGHT:-false}
      FCDO_MAX_ROWS: ${FCDO_MAX_ROWS:-80}
      SCRAPER_HEALTH_PORT: 8081
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    build: .
    restart: unless-stopped
    profiles: ["legacy"]
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      DB_BACKEND: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  postgres_data:
