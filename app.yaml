name: travelintel-app

services:
  - name: briefing-api
    github:
      repo: akindele22/TravelIntel.git
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_size_slug: basic-xs
    instance_count: 1
    run_command: python -m briefing.run_api
    envs:
      - key: DB_HOST
        scope: RUN_TIME
      - key: DB_PORT
        scope: RUN_TIME
      - key: DB_NAME
        scope: RUN_TIME
      - key: DB_USER
        scope: RUN_TIME
      - key: DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_MODEL
        scope: RUN_TIME
      - key: BRIEFING_CACHE_DAYS
        scope: RUN_TIME
